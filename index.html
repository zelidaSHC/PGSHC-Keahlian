/************************************************************

body {

/************************************************************

<script>


/************************************************************
 * GOOGLE APPS SCRIPT URL
 ************************************************************/
const GOOGLE_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzdA7IuyJk6HvU1-n6RkZm5E5QkP5itq_wSrgMEHPsXF_IrmRoao0mxeP4WV_tTvT-TcA/exec';


/************************************************************
 * GLOBAL
 ************************************************************/
let isSubmitting = false;


/************************************************************
 * TAB
 ************************************************************/
function showTab(
  id,
  button
) {

  document
    .querySelectorAll(
      '.tab-content'
    )
    .forEach(
      function(section) {

        section.classList.add(
          'hidden'
        );

      }
    );


  document
    .getElementById(id)
    .classList.remove(
      'hidden'
    );


  document
    .querySelectorAll(
      '.tab'
    )
    .forEach(
      function(tab) {

        tab.classList.remove(
          'active'
        );

      }
    );


  if (button) {

    button.classList.add(
      'active'
    );

  }


  if (
    id === 'share'
  ) {

    document
      .getElementById(
        'shareUrl'
      )
      .value =
      window.location.origin +
      window.location.pathname;

  }

}


/************************************************************
 * APPLICATION NUMBER
 ************************************************************/
function generateApplicationNumber() {

  return (
    'STANDHC-2026-' +
    Math.floor(
      100000 +
      Math.random() *
      900000
    )
  );

}


/************************************************************
 * SUBMISSION ID
 ************************************************************/
function generateSubmissionId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now() +
    '-' +
    Math.random()
      .toString(36)
      .substring(2)
  );

}


/************************************************************
 * JSONP
 ************************************************************/
function jsonpRequest(
  url,
  timeout = 15000
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const callbackName =
        'standhcCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          10000
        );


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          clearTimeout(timer);

          delete window[
            callbackName
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          resolve(data);

        };


      script.onerror =
        function() {

          clearTimeout(timer);

          delete window[
            callbackName
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          reject(
            new Error(
              'Gagal mendapatkan data daripada server.'
            )
          );

        };


      script.src =
        url +
        '&callback=' +
        callbackName;


      document.body.appendChild(
        script
      );


      timer =
        setTimeout(
          function() {

            delete window[
              callbackName
            ];


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }


            reject(
              new Error(
                'Server mengambil masa terlalu lama.'
              )
            );

          },
          timeout
        );

    }
  );

}


/************************************************************
 * SUBMIT REGISTRATION
 ************************************************************/
document
  .getElementById(
    'registrationForm'
  )
  .addEventListener(
    'submit',
    submitRegistration
  );


async function submitRegistration(
  event
) {

  event.preventDefault();


  /******************************************************
   * BLOCK DOUBLE CLICK
   ******************************************************/
  if (
    isSubmitting
  ) {

    return;

  }


  isSubmitting = true;


  const button =
    document.getElementById(
      'submitButton'
    );


  const messageBox =
    document.getElementById(
      'registerMessage'
    );


  button.disabled =
    true;


  button.innerText =
    '⏳ Sedang menghantar...';


  messageBox.className =
    'notice notice-warning';


  messageBox.innerHTML =
    '⏳ Pendaftaran sedang dihantar. Jangan tekan butang sekali lagi.';


  /******************************************************
   * CREATE ONCE
   ******************************************************/
  const noPermohonan =
    generateApplicationNumber();


  const submissionId =
    generateSubmissionId();


  const data = {

    noPermohonan:
      noPermohonan,

    submissionId:
      submissionId,

    nama:
      document
        .getElementById(
          'nama'
        )
        .value
        .trim(),

    ic:
      document
        .getElementById(
          'ic'
        )
        .value
        .trim(),

    telefon:
      document
        .getElementById(
          'telefon'
        )
        .value
        .trim(),

    email:
      document
        .getElementById(
          'email'
        )
        .value
        .trim(),

    alamat:
      document
        .getElementById(
          'alamat'
        )
        .value
        .trim(),

    kategori:
      document
        .getElementById(
          'kategori'
        )
        .value,

    anak:
      document
        .getElementById(
          'anak'
        )
        .value
        .trim(),

    sekolah:
      document
        .getElementById(
          'sekolah'
        )
        .value
        .trim(),

    kategoriAnak:
      document
        .getElementById(
          'kategoriAnak'
        )
        .value
        .trim(),

    jantina:
      document
        .getElementById(
          'jantina'
        )
        .value,

    tarikh:
      document
        .getElementById(
          'tarikh'
        )
        .value

  };


  try {

    await fetch(
      GOOGLE_SCRIPT_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            data
          )

      }
    );


    /****************************************************
     * SUCCESS
     ****************************************************/
    messageBox.className =
      'notice notice-success';


    messageBox.innerHTML =

      '<strong>✅ Pendaftaran berjaya dihantar!</strong>' +

      '<br><br>' +

      'No. Permohonan:' +

      '<br><br>' +

      '<strong style="font-size:22px">' +

      escapeHtml(
        noPermohonan
      ) +

      '</strong>' +

      '<br><br>' +

      'Sila simpan nombor ini untuk semakan status.';


    document
      .getElementById(
        'statusNo'
      )
      .value =
      noPermohonan;


    /****************************************************
     * CLEAR FORM
     ****************************************************/
    document
      .getElementById(
        'registrationForm'
      )
      .reset();


    /****************************************************
     * BUTTON LOCKED
     ****************************************************/
    button.disabled =
      true;


    button.innerText =
      '✅ Pendaftaran Dihantar';


  } catch (error) {

    messageBox.className =
      'notice notice-danger';


    messageBox.innerHTML =
      '❌ Pendaftaran gagal dihantar.<br><br>' +
      escapeHtml(
        error.message
      );


    isSubmitting =
      false;


    button.disabled =
      false;


    button.innerText =
      '📩 Hantar Pendaftaran';

  }

}


/************************************************************
 * CHECK STATUS
 ************************************************************/
async function checkMemberStatus() {

  const no =
    document
      .getElementById(
        'statusNo'
      )
      .value
      .trim()
      .toUpperCase();


  const message =
    document
      .getElementById(
        'statusMessage'
      );


  const resultBox =
    document
      .getElementById(
        'statusResult'
      );


  const button =
    document
      .getElementById(
        'statusButton'
      );


  if (!no) {

    message.className =
      'notice notice-danger';


    message.innerHTML =
      'Sila masukkan No. Permohonan.';


    return;

  }


  button.disabled =
    true;


  button.innerText =
    '⏳ Menyemak...';


  message.className =
    'notice notice-warning';


  message.innerHTML =
    '⏳ Mendapatkan status terkini...';


  resultBox.classList.add(
    'hidden'
  );


  try {

    const url =
      GOOGLE_SCRIPT_URL +
      '?action=check&no=' +
      encodeURIComponent(
        no
      );


    const result =
      await jsonpRequest(
        url
      );


    if (
      !result.ok
    ) {

      throw new Error(
        result.error ||
        'Ralat server.'
      );

    }


    if (
      !result.found
    ) {

      message.className =
        'notice notice-danger';


      message.innerHTML =
        '❌ No. Permohonan tidak dijumpai.';


      return;

    }


    message.className =
      'notice notice-success';


    message.innerHTML =
      '✅ Rekod dijumpai. Status adalah terkini.';


    showStatus(
      result.member
    );


  } catch (error) {

    message.className =
      'notice notice-danger';


    message.innerHTML =
      '❌ ' +
      escapeHtml(
        error.message
      );

  } finally {

    button.disabled =
      false;


    button.innerText =
      '🔎 Semak Status';

  }

}


/************************************************************
 * SHOW STATUS
 ************************************************************/
function showStatus(
  member
) {

  const box =
    document.getElementById(
      'statusResult'
    );


  let statusClass =
    'status-review';


  let icon =
    '⏳';


  if (
    member.status ===
    'Diluluskan'
  ) {

    statusClass =
      'status-approved';

    icon =
      '✅';

  }


  if (
    member.status ===
    'Ditolak'
  ) {

    statusClass =
      'status-rejected';

    icon =
      '❌';

  }


  box.className =
    'status-box ' +
    statusClass;


  box.innerHTML = `

    <h3>
      ${icon}
      Status:
      ${escapeHtml(
        member.status
      )}
    </h3>

    <p>
      <strong>
      No. Permohonan:
      </strong>
      <br>
      ${escapeHtml(
        member.noPermohonan
      )}
    </p>

    <p>

async function adminLogin() {

  const name =
    document
      .getElementById(
        'adminName'
      )
      .value
      .trim();


  const key =
    document
      .getElementById(
        'adminKey'
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        'adminLoginMessage'
      );


  const button =
    document
      .getElementById(
        'adminLoginButton'
      );


  if (
    !name ||
    !key
  ) {

    message.className =
      'notice notice-danger';


    message.innerHTML =
      'Sila masukkan Nama Admin dan Admin Key.';


    return;

  }


  button.disabled =
    true;


  button.innerText =
    '⏳ Login...';


  try {

    const url =
      GOOGLE_SCRIPT_URL +
      '?action=members&key=' +
      encodeURIComponent(
        key
      );


    const result =
      await jsonpRequest(
        url
      );


    if (
      !result.ok
    ) {

      throw new Error(
        result.error ||
        'Login gagal.'
      );

    }


    sessionStorage.setItem(
      'standhc_admin_name',
      name
    );


    sessionStorage.setItem(
      'standhc_admin_key',
      key
    );


    document
      .getElementById(
        'adminLoginBox'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'adminPanel'
      )
      .classList.remove(
        'hidden'
      );


    renderAdminMembers(
      result.members || []
    );


  } catch (error) {

      'notice notice-danger';

      );

  } finally {

    button.disabled =
      false;


    button.innerText =

/************************************************************
 * RENDER ADMIN
 ************************************************************/
function renderAdminMembers(
  members
) {

  const table =
    document.getElementById(
      'adminTable'
    );


  if (
    !members.length
  ) {

    table.innerHTML =
      '<p>Tiada pendaftaran.</p>';

    return;

  }


  let html = `

  <div class="table-wrap">

  <table>

  <thead>

  <tr>

  <th>
  No.
  </th>

  <th>
  No. Permohonan
  </th>

  <th>
  Nama
  </th>

  <th>
  Telefon
  </th>

  <th>
  Kategori
  </th>

  <th>
  Status
  </th>

  <th>
  No. Keahlian
  </th>

  <th>
  Tindakan
  </th>

  </tr>

  </thead>

  <tbody>

  `;


  members.forEach(
    function(member) {

      html += `

      <tr>

      <td>
      ${member.row}
      </td>

      <td>
      ${escapeHtml(
        member.noPermohonan
      )}
      </td>

      <td>
      ${escapeHtml(
        member.nama
      )}
      </td>

      <td>
      ${escapeHtml(
        member.telefon || '-'
      )}
      </td>

      <td>
      ${escapeHtml(
        member.kategori || '-'
      )}
      </td>

      <td>
      <strong>
      ${escapeHtml(
        member.status
      )}
      </strong>
      </td>

      <td>
      ${
        member.noKeahlian
        ?
        escapeHtml(
          member.noKeahlian
        )
        :
        '-'
      }
      </td>

      <td>
      `;


      /****************************************************
       * DALAM SEMAKAN
       ****************************************************/
      if (
        member.status ===
        'Dalam Semakan'
      ) {

        html += `

        <button
        class="btn btn-success"
        onclick="approveMember(${member.row})">

        ✅ Lulus

        </button>

        <button
        class="btn btn-danger"
        onclick="rejectMember(${member.row})">

        ❌ Tolak

        </button>

        `;

      }


      /****************************************************
       * WHATSAPP
       *
       * HANYA SELEPAS PROSES STATUS
       ****************************************************/
      if (
        (
          member.status ===
          'Diluluskan' ||
          member.status ===
          'Ditolak'
        )
      ) {

        if (
          member.telefon
        ) {

          html += `

          <button
          id="wa-${member.row}"
          class="btn btn-whatsapp"
          onclick="sendStatusWhatsApp(${member.row})">

          📱 Hantar Status WhatsApp

          </button>

          `;

        } else {

          html += `

          <div
          class="notice notice-warning">

          ⚠️ No. telefon tiada

          </div>

          `;

        }

      }


      html += `

      </td>

      </tr>

      `;

    }
  );


  html += `

  </tbody>

  </table>

  </div>

  `;


  table.innerHTML =
    html;

}

/************************************************************
 * UPDATE STATUS
 ************************************************************/
async function updateStatus(
  row,
  status,
  catatan
) {

  const key =
    sessionStorage.getItem(
      'standhc_admin_key'
    );


  const adminName =
    sessionStorage.getItem(
      'standhc_admin_name'
    ) ||
    'Admin STAND HC';


  if (!key) {

    alert(
      'Sesi Admin telah tamat. Sila login semula.'
    );

    return;

  }


  const data = {

    action:
      'updateStatus',

    row:
      row,

    status:
      status,

    adminName:
      adminName,

    adminKey:
      key,

    catatan:
      catatan || ''

  };


  try {

    await fetch(
      GOOGLE_SCRIPT_URL,
      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body:
          JSON.stringify(
            data
          )

      }
    );


    if (
      status ===
      'Diluluskan'
    ) {

      alert(
        '✅ Pendaftaran telah DILULUSKAN.\n\n' +
        'No. Keahlian telah dijana.\n\n' +
        'Selepas refresh, butang WhatsApp akan tersedia.'
      );

    } else {

      alert(
        '❌ Pendaftaran telah DITOLAK.'
      );

    }


    await loadAdminMembers();


  } catch (error) {

    alert(
      '❌ Ralat: ' +
      error.message
    );

  }

}


/************************************************************
 * NORMALIZE PHONE
 ************************************************************/
function normalizeMalaysiaPhone(
  phone
) {

  let value =
    String(
      phone || ''
    )
    .trim();


  /******************************************************
   * BUANG SPACE / DASH / BRACKET
   ******************************************************/
  value =
    value.replace(
      /[\s\-().]/g,
      ''
    );


  /******************************************************
   * +60123456789
   * ->
   * 60123456789
   ******************************************************/
  if (
    value.startsWith(
      '+60'
    )
  ) {

    value =
      value.substring(1);

  }


  /******************************************************
   * 0123456789
   * ->
   * 60123456789
   ******************************************************/
  else if (
    value.startsWith('0')
  ) {

    value =
      '60' +
      value.substring(1);

  }


  /******************************************************
   * 123456789
   * ->
   * 60123456789
   ******************************************************/
  else if (
    value.startsWith('1')
  ) {

    value =
      '60' +
      value;

  }


  /******************************************************
   * DIGIT ONLY
   ******************************************************/
  value =
    value.replace(
      /\D/g,
      ''
    );


  /******************************************************
   * MALAYSIA MOBILE VALIDATION
   *
   * 601XXXXXXXX
   * 601XXXXXXXXX
   ******************************************************/
  if (
    !/^601\d{8,9}$/.test(
      value
    )
  ) {

    return {

      valid:
        false,

      phone:
        value

    };

  }


  return {

    valid:
      true,

    phone:
      value

  };

}


/************************************************************
 * SEND WHATSAPP
 ************************************************************/
async function sendStatusWhatsApp(
  row
) {

  const button =
    document.getElementById(
      'wa-' + row
    );


  if (button) {

    button.disabled =
      true;

    button.innerText =
      '⏳ Semak nombor...';

  }


  try {

    const key =
      sessionStorage.getItem(
        'standhc_admin_key'
      );


    if (!key) {

      throw new Error(
        'Sesi Admin telah tamat. Sila login semula.'
      );

    }


    /******************************************************
     * GET LATEST DATA
     ******************************************************/
    const url =
      GOOGLE_SCRIPT_URL +
      '?action=members&key=' +
      encodeURIComponent(
        key
      );


    const result =
      await jsonpRequest(
        url
      );


    if (
      !result.ok
    ) {

      throw new Error(
        result.error ||
        'Gagal mendapatkan data ahli.'
      );

    }


    /******************************************************
     * FIND MEMBER
     ******************************************************/
    const member =
      (
        result.members || []
      ).find(
        function(item) {

          return (
            Number(
              item.row
            ) ===
            Number(row)
          );

        }
      );


    if (!member) {

      throw new Error(
        'Rekod ahli tidak dijumpai.'
      );

    }


    /******************************************************
     * CHECK STATUS
     ******************************************************/
    if (
      member.status !==
      'Diluluskan' &&
      member.status !==
      'Ditolak'
    ) {

      throw new Error(
        'Status masih belum diproses.'
      );

    }


    /******************************************************
     * CHECK PHONE
     ******************************************************/
    if (
      !member.telefon
    ) {

      throw new Error(
        'No. telefon ahli tiada dalam rekod.'
      );

    }


    /******************************************************
     * FORMAT PHONE
     ******************************************************/
    const phoneResult =
      normalizeMalaysiaPhone(
        member.telefon
      );


    if (
      !phoneResult.valid
    ) {

      throw new Error(

        'No. telefon "' +
        member.telefon +
        '" tidak sah.\n\n' +

        'Contoh nombor yang betul:\n' +
        '0123456789\n' +
        '+60123456789'

      );

    }


    const phone =
      phoneResult.phone;


    /******************************************************
     * MESSAGE
     ******************************************************/
    let message =
      '';


    /******************************************************
     * APPROVED
     ******************************************************/
    if (
      member.status ===
      'Diluluskan'
    ) {

      message =
`🤾‍♂️ STAND HANDBALL CLUB (STAND HC)

Assalamualaikum dan Selamat Sejahtera.

🎉 TAHNIAH!

Permohonan keahlian anda telah DILULUSKAN.

👤 Nama:
${member.nama}

📝 No. Permohonan:
${member.noPermohonan}

🪪 No. Keahlian:
${member.noKeahlian || '-'}

📅 Tarikh Diluluskan:
${member.tarikhDiluluskan || '-'}

Terima kasih kerana menjadi ahli STAND Handball Club.

🤾‍♂️ STAND HC`;


    }


    /******************************************************
     * REJECTED
     ******************************************************/
    else {

      message =
`🤾‍♂️ STAND HANDBALL CLUB (STAND HC)

Assalamualaikum dan Selamat Sejahtera.

Makluman mengenai permohonan keahlian STAND HC.

👤 Nama:
${member.nama}

${member.noPermohonan}

DITOLAK

🤾‍♂️ STAND HC`;

    }

     ******************************************************/
    const whatsappUrl =
      'https://wa.me/' +
      phone +
      '?text=' +
      encodeURIComponent(

      );

     * OPEN WHATSAPP
     ******************************************************/
    window.open(

      '_blank'
    );


    /******************************************************

     ******************************************************/

      button.disabled =
        true;

      button.innerText =
        '✅ WhatsApp Dibuka';

    }


  } catch (error) {

    if (button) {

      button.disabled =

      button.innerText =

/************************************************************

 ************************************************************/
function copyShareLink() {

  const url =
    window.location.origin +
    window.location.pathname;


  navigator
    .clipboard
    .writeText(
      url
    )
    .then(
      function() {

        const message =
          document
            .getElementById(
              'shareMessage'
            );


        message.classList.remove(
          'hidden'
        );


        setTimeout(
          function() {

            message.classList.add(
              'hidden'
            );

          },
          3000
        );

      }
    );

}

/************************************************************
 * ESCAPE HTML
 ************************************************************/
function escapeHtml(
  value
) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}

      )
      .padStart(
        2,
        '0'
      );


    const dd =
      String(
        today.getDate()
      )
      .padStart(
        2,
        '0'
      );


    dateInput.value =
      yyyy +
      '-' +
      mm +
      '-' +
      dd;

  }

})();
